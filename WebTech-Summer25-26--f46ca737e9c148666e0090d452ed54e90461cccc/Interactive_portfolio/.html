<!DOCTYPE html>
<html>

<head>
    <title>Interactive Portfolio</title>
</head>

<body>

<center>

    <h1>My Portfolio</h1>

    <h2 id="greeting">Good Morning</h2>

    <button id="themeBtn">Dark Mode</button>

    <hr>

    <!-- Navigation -->

    <button>About</button>
    <button>Projects</button>
    <button>Contact</button>

    <hr>

</center>

<!-- About Section -->

<div id="about">

    <h2>About Me</h2>

    <p>
        Hello! My name is Swarna Biswas.
        I am a CSE student at AIUB.
        I want to become a Web Developer.
    </p>

</div>

<hr>

<!-- Projects Section -->

<div id="projects">

    <h2>My Projects</h2>

    <ul>
        <li>Portfolio Website</li>
        <li>Student Management System</li>
        <li>Online Shopping Website</li>
    </ul>

</div>

<hr>

<!-- Contact Section -->

<div id="contact">

    <h2>Contact Me</h2>

    <form>

        <label>Name:</label><br>
        <input type="text" id="name">

        <br><br>

        <label>Email:</label><br>
        <input type="text" id="email">

        <br><br>

        <label>Message:</label><br>

        <textarea id="message" rows="5" cols="30"></textarea>

        <br><br>

        <button type="submit">Submit</button>

    </form>

</div>

<br>

<div id="error"></div>

<div id="result"></div>

</body>

</html>
